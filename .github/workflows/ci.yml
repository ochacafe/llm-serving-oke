name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  terraform:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.5.7   # OCI Resource Manager と同じ系列
      - run: terraform -chdir=terraform fmt -check -recursive
      - run: terraform -chdir=terraform init -backend=false -input=false
      - run: terraform -chdir=terraform validate

  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: shellcheck -x scripts/*.sh

  loadgen:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv run --project loadgen loadgen --help

  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # gitleaks-action は Organization リポジトリでライセンスキーが必要なため CLI を直接使う
      - name: gitleaks
        run: |
          curl -sSL https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz | tar xz gitleaks
          ./gitleaks git --no-banner --redact -v .
      - name: OCID が混入していないこと
        run: |
          if grep -rnE 'ocid1\.(tenancy|compartment|user|cluster|ormstack|ormjob)\.oc1\.[a-z0-9-]*\.[a-z0-9]{20,}' --exclude-dir=.git .; then
            echo "::error::実 OCID がコミットされています"; exit 1
          fi
