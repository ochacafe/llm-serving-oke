[project]
name = "loadgen"
version = "0.1.0"
description = "Demo load generator for vLLM / llm-d / KServe routing comparison"
requires-python = ">=3.12"
dependencies = [
  "httpx>=0.27",
  "rich>=13.7",
  "typer>=0.12",
]

[project.scripts]
loadgen = "loadgen.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/loadgen"]
