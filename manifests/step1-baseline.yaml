# Step 1: YAML 1 枚の LLMInferenceService（スケジューラなし = 普通の L7 LB で振り分け）
apiVersion: serving.kserve.io/v1alpha2
kind: LLMInferenceService
metadata:
  name: sim-baseline
  namespace: llm-demo
spec:
  model:
    name: demo-llm
    uri: hf://mock/demo-llm
  replicas: 4
  storageInitializer:
    enabled: false
  annotations:
    prometheus.io/scrape: "true"
    prometheus.io/port: "8000"
    prometheus.io/path: /metrics
  router:
    route: {}
  template:
    containers:
      - name: main
        image: ghcr.io/llm-d/llm-d-inference-sim:v0.11.2
        command: ["/app/llm-d-inference-sim"]
        args:
          - --port
          - "8000"
          - --model
          - "{{ .Spec.Model.Name }}"
          - --mode
          - random
          - --max-model-len
          - "8192"
          - --max-num-seqs
          - "3"
          - --latency-calculator
          - per-token
          - --prefill-overhead
          - 20ms
          - --prefill-time-per-token
          - 200us
          - --inter-token-latency
          - 20ms
          - --time-factor-under-load
          - "2.0"
          - --enable-kvcache
          - --block-size
          - "16"
          - --kv-cache-size
          - "800"
          - "{{ if .GlobalConfig.EnableTLS }}--ssl-certfile{{- end }}"
          - "{{ if .GlobalConfig.EnableTLS }}/var/run/kserve/tls/tls.crt{{- end }}"
          - "{{ if .GlobalConfig.EnableTLS }}--ssl-keyfile{{- end }}"
          - "{{ if .GlobalConfig.EnableTLS }}/var/run/kserve/tls/tls.key{{- end }}"
        env:
          - name: POD_NAME
            valueFrom: { fieldRef: { fieldPath: metadata.name } }
          - name: POD_NAMESPACE
            valueFrom: { fieldRef: { fieldPath: metadata.namespace } }
          - name: POD_IP
            valueFrom: { fieldRef: { fieldPath: status.podIP } }
        resources:
          requests: { cpu: 100m, memory: 128Mi }
          limits: { cpu: "1", memory: 512Mi }
        securityContext:
          runAsNonRoot: true
          runAsUser: 65532
          runAsGroup: 65532
