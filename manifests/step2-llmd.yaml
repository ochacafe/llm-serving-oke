# Step 2: router に scheduler を足すだけで llm-d のスケジューラ（EPP + InferencePool）が付く
apiVersion: serving.kserve.io/v1alpha2
kind: LLMInferenceService
metadata:
  name: sim-llmd
  namespace: llm-demo
spec:
  model:
    name: demo-llm
    uri: hf://mock/demo-llm
  replicas: 4
  storageInitializer:
    enabled: false
  annotations:
    prometheus.io/scrape: "true"
    prometheus.io/port: "8000"
    prometheus.io/path: /metrics
  router:
    route: {}
    scheduler:
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "9090"
        prometheus.io/path: /metrics
      template:
        containers:
          - name: main
            args: ["--metrics-endpoint-auth=false"]
            resources:
              requests: { cpu: 250m, memory: 512Mi }
      config:
        inline:
          apiVersion: inference.networking.x-k8s.io/v1alpha1
          kind: EndpointPickerConfig
          plugins:
            - type: single-profile-handler
            - type: prefix-cache-scorer
            - type: queue-scorer
            - type: kv-cache-utilization-scorer
            - type: max-score-picker
          schedulingProfiles:
            - name: default
              plugins:
                - pluginRef: prefix-cache-scorer
                  weight: 5
                - pluginRef: queue-scorer
                  weight: 1
                - pluginRef: kv-cache-utilization-scorer
                  weight: 1
                - pluginRef: max-score-picker
  template:
    containers:
      - name: main
        image: ghcr.io/llm-d/llm-d-inference-sim:v0.11.2
        command: ["/app/llm-d-inference-sim"]
        args:
          - --port
          - "8000"
          - --model
          - "{{ .Spec.Model.Name }}"
          - --mode
          - random
          - --max-model-len
          - "8192"
          - --max-num-seqs
          - "3"
          - --latency-calculator
          - per-token
          - --prefill-overhead
          - 20ms
          - --prefill-time-per-token
          - 200us
          - --inter-token-latency
          - 20ms
          - --time-factor-under-load
          - "2.0"
          - --enable-kvcache
          - --block-size
          - "16"
          - --kv-cache-size
          - "800"
          - "{{ if .GlobalConfig.EnableTLS }}--ssl-certfile{{- end }}"
          - "{{ if .GlobalConfig.EnableTLS }}/var/run/kserve/tls/tls.crt{{- end }}"
          - "{{ if .GlobalConfig.EnableTLS }}--ssl-keyfile{{- end }}"
          - "{{ if .GlobalConfig.EnableTLS }}/var/run/kserve/tls/tls.key{{- end }}"
        env:
          - name: POD_NAME
            valueFrom: { fieldRef: { fieldPath: metadata.name } }
          - name: POD_NAMESPACE
            valueFrom: { fieldRef: { fieldPath: metadata.namespace } }
          - name: POD_IP
            valueFrom: { fieldRef: { fieldPath: status.podIP } }
        resources:
          requests: { cpu: 100m, memory: 128Mi }
          limits: { cpu: "1", memory: 512Mi }
        securityContext:
          runAsNonRoot: true
          runAsUser: 65532
          runAsGroup: 65532
