# Step 3: prefill を書き足して P/D 分離（Prefill Pod → Decode Pod にリレー）
apiVersion: serving.kserve.io/v1alpha2
kind: LLMInferenceService
metadata:
  name: sim-pd
  namespace: llm-demo
spec:
  model:
    name: demo-llm
    uri: hf://mock/demo-llm
  replicas: 2                    # decode 側のレプリカ数
  storageInitializer:
    enabled: false
  annotations:
    prometheus.io/scrape: "true"
    prometheus.io/port: "8001"   # decode は sim が 8001、8000 はルーティングサイドカー
    prometheus.io/path: /metrics
  router:
    route: {}
    scheduler:                   # config を書かない → KServe が P/D 用の EPP 設定を自動で選ぶ
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "9090"
        prometheus.io/path: /metrics
      template:
        containers:
          - name: main
            args: ["--metrics-endpoint-auth=false"]
            resources:
              requests: { cpu: 250m, memory: 512Mi }
  template:                      # decode 側
    containers:
      - name: main
        image: ghcr.io/llm-d/llm-d-inference-sim:v0.11.2
        command: ["/app/llm-d-inference-sim"]
        args:
          - --port
          - "8001"
          - --model
          - "{{ .Spec.Model.Name }}"
          - --mode
          - random
          - --max-model-len
          - "8192"
          - --latency-calculator
          - constant
          - --kv-cache-transfer-latency
          - 100ms
          - --inter-token-latency
          - 30ms
          - --v
          - "4"
          - "{{ if .GlobalConfig.EnableTLS }}--ssl-certfile{{- end }}"
          - "{{ if .GlobalConfig.EnableTLS }}/var/run/kserve/tls/tls.crt{{- end }}"
          - "{{ if .GlobalConfig.EnableTLS }}--ssl-keyfile{{- end }}"
          - "{{ if .GlobalConfig.EnableTLS }}/var/run/kserve/tls/tls.key{{- end }}"
        env:
          - name: POD_NAME
            valueFrom: { fieldRef: { fieldPath: metadata.name } }
          - name: POD_NAMESPACE
            valueFrom: { fieldRef: { fieldPath: metadata.namespace } }
          - name: POD_IP
            valueFrom: { fieldRef: { fieldPath: status.podIP } }
        resources:
          requests: { cpu: 100m, memory: 128Mi }
          limits: { cpu: "1", memory: 512Mi }
        securityContext:
          runAsNonRoot: true
          runAsUser: 65532
          runAsGroup: 65532
  prefill:
    replicas: 2
    annotations:
      prometheus.io/scrape: "true"
      prometheus.io/port: "8000"
      prometheus.io/path: /metrics
    template:
      containers:
        - name: main
          image: ghcr.io/llm-d/llm-d-inference-sim:v0.11.2
          command: ["/app/llm-d-inference-sim"]
          args:
            - --port
            - "8000"
            - --model
            - "{{ .Spec.Model.Name }}"
            - --mode
            - random
            - --max-model-len
            - "8192"
            - --latency-calculator
            - constant
            - --time-to-first-token
            - 1500ms
            - --v
            - "4"
            - "{{ if .GlobalConfig.EnableTLS }}--ssl-certfile{{- end }}"
            - "{{ if .GlobalConfig.EnableTLS }}/var/run/kserve/tls/tls.crt{{- end }}"
            - "{{ if .GlobalConfig.EnableTLS }}--ssl-keyfile{{- end }}"
            - "{{ if .GlobalConfig.EnableTLS }}/var/run/kserve/tls/tls.key{{- end }}"
          env:
            - name: POD_NAME
              valueFrom: { fieldRef: { fieldPath: metadata.name } }
            - name: POD_NAMESPACE
              valueFrom: { fieldRef: { fieldPath: metadata.namespace } }
            - name: POD_IP
              valueFrom: { fieldRef: { fieldPath: status.podIP } }
          resources:
            requests: { cpu: 100m, memory: 128Mi }
            limits: { cpu: "1", memory: 512Mi }
          securityContext:
            runAsNonRoot: true
            runAsUser: 65532
            runAsGroup: 65532
