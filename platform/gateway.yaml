# データプレーン Service を ClusterIP にする（OCI Load Balancer を作らない = 課金・公開なし）。
# デモ中のアクセスは scripts/port-forward.sh で行う。
apiVersion: agentgateway.dev/v1alpha1
kind: AgentgatewayParameters
metadata:
  name: kserve-ingress-gateway
  namespace: kserve
spec:
  service:
    spec:
      type: ClusterIP
---
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: kserve-ingress-gateway
  namespace: kserve
spec:
  gatewayClassName: agentgateway
  listeners:
    - name: http
      protocol: HTTP
      port: 80
      allowedRoutes:
        namespaces:
          from: All
  infrastructure:
    labels:
      serving.kserve.io/gateway: kserve-ingress-gateway
    parametersRef:
      group: agentgateway.dev
      kind: AgentgatewayParameters
      name: kserve-ingress-gateway
