title: "vLLM / llm-d / KServe demo on OKE"
description: "llm-d-inference-sim を使った LLM サービングデモ用の OKE クラスタ（CPU ノードのみ）を作成します。"
informationalText: "クラスタの操作は operator インスタンス上で行います（手元からは scripts/10-infra-up.sh が SSH 設定まで行います）。"
schemaVersion: 1.1.0
version: "20261012"
locale: "en"

variableGroups:
  - title: "Hidden"
    visible: false
    variables:
      - tenancy_ocid
      - region

  - title: "Placement"
    variables:
      - compartment_ocid
      - cluster_name

  - title: "Access"
    variables:
      - admin_cidrs
      - ssh_public_key

  - title: "Cluster"
    variables:
      - kubernetes_version
      - worker_count
      - worker_shape
      - worker_ocpus
      - worker_memory_gb
      - worker_boot_volume_gb

variables:
  compartment_ocid:
    type: oci:identity:compartment:id
    title: "Compartment"
    required: true

  cluster_name:
    type: string
    title: "Cluster name"
    default: "llm-demo"
    required: true

  admin_cidrs:
    type: array
    items:
      type: string
      pattern: "^([0-9]{1,3}\\.){3}[0-9]{1,3}/[0-9]{1,2}$"
    title: "踏み台への SSH を許可する CIDR"
    description: "踏み台（bastion）に SSH する端末のグローバル IP（例: 203.0.113.10/32）。IP が変わったらスタックを更新して再 Apply します。"
    required: true

  ssh_public_key:
    type: oci:core:ssh:publickey
    title: "SSH 公開鍵"
    description: "bastion / operator に登録する公開鍵"
    required: true

  kubernetes_version:
    type: enum
    title: "Kubernetes version"
    enum:
      - "v1.35.2"
      - "v1.36.1"
      - "v1.34.2"
    default: "v1.35.2"
    required: true

  worker_count:
    type: integer
    title: "Worker nodes"
    minimum: 1
    maximum: 10
    default: 3
    required: true

  worker_shape:
    type: enum
    title: "Worker shape (x86)"
    enum:
      - "VM.Standard.E5.Flex"
      - "VM.Standard.E4.Flex"
    default: "VM.Standard.E5.Flex"
    required: true

  worker_ocpus:
    type: integer
    title: "OCPUs per worker"
    minimum: 1
    maximum: 16
    default: 2
    required: true

  worker_memory_gb:
    type: integer
    title: "Memory (GB) per worker"
    minimum: 8
    maximum: 128
    default: 16
    required: true

  worker_boot_volume_gb:
    type: integer
    title: "Boot volume (GB) per worker"
    minimum: 50
    maximum: 200
    default: 50
    required: true

outputs:
  cluster_id:
    type: ocid
    title: "OKE cluster OCID"
  bastion_public_ip:
    type: string
    title: "bastion のパブリック IP"
  operator_private_ip:
    type: string
    title: "operator のプライベート IP"
  ssh_to_operator:
    type: copyableString
    title: "operator への SSH コマンド"
